<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <Style>
        body {
            background-color: #f0f0f0;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .logo {
            display: flex;
            height: 50px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;

        }

        .logo-img {
            height: 100%;
            margin: 0 10px;
        }

        .logo-Text {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .logo-subtitle {
            font-size: 12px;
            color: #666;
        }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .statusBar {
            display: flex;
            justify-content: space-between;
            width: 80%;
            border-bottom: 1px solid #ddd;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 100px;
        }

        .progress {
            display: flex;
            justify-content: space-between;
            width: 100%;
            border-bottom: 1px solid #ddd;
            margin-top: 10px;
        }

        .musicIcon {
            display: flex;
            justify-content: space-between;
            width: 100%;
            border-bottom: 1px solid #ddd;
        }

        .musicTrack {
            display: flex;
            justify-content: space-between;
            width: 100%;
            border-bottom: 1px solid #ddd;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 20px;

        }
    </Style>
</head>

<body>
    <audio src="music/01airball.mp3" controls id="MyPlayer"></audio>
    <hr>
    <div class="container">
        <header class="logo">
            <div><img src="icon/logo.png" alt="logo" class="logo-img"></div>
            <div class="logo-Text">
                <span class="logo-title">勞動部勞動力發展署</span>
                <span class="logo-subtitle">高屏澎東分署</span>
            </div>
        </header>
        <main class="main">
            <section class="statusBar">
                <span class="status" id="status">已停止</span>
                <span class="songTitle" id="songTitle">曲名</span>
            </section>
            <section class="progress">
                <span class="progressText" id="progressText"></span>
                <input type="range" id="progress" value="0" min="0" max="100">
            </section>
            <section class="musicIcon">
                <span class="icon" title="prev"><i class="fa-solid fa-backward-step" id="prev"></i></span>
                <span class="icon" title="return 5sec"><i class="fa-solid fa-angle-left" id="return"></i></span>
                <span class="icon" title="play"><i class="fa-regular fa-circle-play" id="play"></i></span>
                <span class="icon" title="pause"><i class="fa-regular fa-circle-pause" id="pause" style="display:none;"></i></span>
                <span class="icon" title="stop"><i class="fa-regular fa-circle-stop" id="stop"></i></span>
                <span class="icon" title="fast 5sec"><i class="fa-solid fa-angle-right" id="fast"></i></span>
                <span class="icon" title="next"><i class="fa-solid fa-forward-step" id="next"></i></span>
                <span class="icon" title="volume"><i class="fa-solid fa-volume-high" id="volumeIcon"></i></span>
                <span class="icon" title="mute"><i class="fa-solid fa-volume-xmark" id="mute"></i></span>
                <input type="range" id="volumeRange" value="0" min="0" max="1" step="0.01">
            </section>
            <section class="musicTrack">
                <h2 id="currentSongName">選擇一首歌曲開始</h2>
                <p id="currentSongTime">00:00</p>
            </section>

        </main>
    </div>

    <script>
        const MyPlayer = document.getElementById("MyPlayer");
        const volumeRange = document.getElementById("volumeRange");
        let Song = ["music/01airball.mp3", "music/02elysees.mp3", "music/03moon.mp3", "music/04nothing.mp3", "music/05rain.mp3", "music/06travel.mp3"]
        let MusicTracks = 0
        //musicIcon控制層
        function changSong() {
            MyPlayer.src = Song[MusicTracks];
            MyPlayer.load();
            MyPlayer.play();
        };

        document.getElementById("play").addEventListener("click", () => {
            MyPlayer.play();
            document.getElementById("play").style.display = "none";
            document.getElementById("pause").style.display = "inline";
        });
        document.getElementById("pause").addEventListener("click", () => {
            MyPlayer.pause();
            document.getElementById("pause").style.display = "none";
            document.getElementById("play").style.display = "inline";
        });
        document.getElementById("stop").addEventListener("click", () => {
            MyPlayer.pause();
            progressText.value = 0;
            MyPlayer.currentTime = 0;
        });
        document.getElementById("prev").addEventListener("click", () => {
            MusicTracks--
            if (MusicTracks < 0) {
                MusicTracks = Song.length - 1
            }
            changSong();
        });
        document.getElementById("next").addEventListener("click", () => {
            MusicTracks++
            if (MusicTracks >= Song.length) {
                MusicTracks = 0
            }
            changSong();
        });
        document.getElementById("return").addEventListener("click", () => {
            MyPlayer.currentTime -= 5
        });
        document.getElementById("fast").addEventListener("click", () => {
            MyPlayer.currentTime += 5
        });
        //聲音控制條
        volumeRange.addEventListener("input", () => {
            MyPlayer.volume = volumeRange.value;
        });
        //曲終自動撥放下一首
        MyPlayer.addEventListener("ended", () => {
            document.getElementById("next").click();
        });

        //進度條控制層
        const progress = document.getElementById("progress")
        const progressText = document.getElementById("progressText")
        function progressT() {
            if (!isNaN(MyPlayer.duration)) {
                let currentTimeMin = parseInt(MyPlayer.currentTime / 60);
                let currentTimeSce = parseInt(MyPlayer.currentTime % 60);
                let durationMin = parseInt(MyPlayer.duration / 60);
                let durationSce = parseInt(MyPlayer.duration % 60);
                let displayCTMin = currentTimeMin < 10 ? "0" + currentTimeMin : currentTimeMin;
                let displayCTSce = currentTimeSce < 10 ? "0" + currentTimeSce : currentTimeSce;
                let displayDTMin = durationMin < 10 ? "0" + durationMin : durationMin;
                let displayDTSce = durationSce < 10 ? "0" + durationSce : durationSce;
                progressText.innerHTML = `${displayCTMin}:${displayCTSce}/${displayDTMin}:${displayDTSce}`
            };
        };
        MyPlayer.addEventListener("timeupdate", () => {
            progress.value = (MyPlayer.currentTime / MyPlayer.duration) * 100;
            progressT();
        });
        progress.addEventListener("input", () => {
            MyPlayer.currentTime = (progress.value / 100) * MyPlayer.duration
        });
        //狀態列顯示
        const songTitle = document.getElementById("songTitle");
        const status = document.getElementById("status")
        function getSongName(path) {
            return path.split('/').pop().split('.').shift();
        }
        MyPlayer.addEventListener("play", () => {
            songTitle.innerHTML = `曲名:${getSongName(Song[MusicTracks])}`;
            status.innerHTML = '狀態:播放中'
        })
        MyPlayer.addEventListener("pause", () => {
            status.innerHTML = '狀態:已停止'
        })
    </script>
</body>

</html>
