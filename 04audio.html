<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01的音樂撥放器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="04audio.css" />
</head>

<body>
    <audio src="music/01airball.mp3" id="MyPlayer"></audio>
    <div class="container">
        <header class="logo">
            <div><img src="music/logo.png" alt="logo" class="logo-img"></div>
            <div class="logo-Text">
                <span class="logo-title">勞動部勞動力發展署</span>
                <span class="logo-subtitle">高屏澎東分署</span>
            </div>
        </header>
        <main class="main">
            <section class="statusBar">
                <span class="status" id="status">已停止</span>
                <span class="songTitle" id="songTitle">曲名""</span>
            </section>
            <section class="progress">
                <span class="progressText" id="progressText"></span>
                <input type="range" id="progress" value="0" min="0" max="100">
            </section>
            <section class="musicIcon">
                <span class="icon" title="上一首" id="prev"><i class="fa-solid fa-backward-step"></i></span>
                <span class="icon" title="回退5秒" id="return"><i class="fa-solid fa-angle-left"></i></span>
                <span class="icon icon-toggle" title="開始/暫停" >
                    <i class="fa-regular fa-circle-play" id="play"></i>
                    <i class="fa-regular fa-circle-pause" id="pause" style="display:none;"></i>
                </span>
                <span class="icon" title="停止" id="stop"><i class="fa-regular fa-circle-stop"></i></span>
                <span class="icon" title="快進5秒" id="fast"><i class="fa-solid fa-angle-right"></i></span>
                <span class="icon" title="下一首" id="next"><i class="fa-solid fa-forward-step"></i></span>
            </section>
            <section class="volIcon">
                <span class="icon icon-toggle" title="靜音">
                    <i class="fa-solid fa-volume-high" id="volume"></i>
                    <i class="fa-solid fa-volume-xmark" id="mute" style="display:none;"></i>
                </span>
                <input type="range" id="volumeRange" value="0" min="0" max="1" step="0.01">
            </section>
            <section class="musicTrack">
                <div id="currentSongName"></div>
            </section>

        </main>
    </div>

    <script src="04audio.js"></script>
</body>

</html>
